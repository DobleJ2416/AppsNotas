<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="icon" type="image/png" href="logo.png"> -->
    <title>Mis Apuntes - IPN</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <!-- Motor matemático KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    
    <!-- Editor Quill.js (Tema Snow) -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

</head>
<body>
    <div id="login-overlay" class="login-pantalla">
        <div class="login-card">
            <h1>👋 ¡Bienvenido a Mis Apuntes!</h1>
            <p>Guarda tus notas en la nube para acceder a ellas desde cualquier dispositivo, o usa la aplicación de forma local.</p>

            <div class="login-acciones">
                <!-- Botón preparado para Firebase Auth -->
                <button id="btn-login-google" class="btn-google">
                    <!-- Icono de Google -->
                    <svg width="20" height="20" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                    </svg>
                    Iniciar sesión con Google
                </button>

                <div class="login-divisor"><span>o</span></div>

                <button id="btn-login-local" class="btn-secundario">Continuar en Modo Desconectado</button>
            </div>
            <p class="login-nota">En el modo desconectado, tus apuntes solo se guardarán en este dispositivo.</p>
        </div>
    </div>
    <div class="app-container">
        <!-- Panel 1: Lista de Materias -->
        <aside class="sidebar">
            <h2>Materias</h2>
            <ul id="lista-materias">
                <!-- Las materias se cargarán aquí desde Firebase -->
            </ul>
            <button id="btn-nueva-materia">+ Nueva Materia</button>
            <button id="btn-info" style="margin-top: 15px; background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color);">ℹ️ <span class="texto-oculto-movil">Acerca de</span></button>
            <button id="btn-tema" style="margin-top: 15px; background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color);">🌙 Modo Oscuro</button>
            <!-- Botón de Login -->
            <button id="btn-login" style="margin-top: 15px; background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color);">👤 <span class="texto-oculto-movil">Ingresar</span></button>
        </aside>

        <!-- Panel 2: Lista de Apuntes -->
        <section class="notes-list">
            <h2 id="titulo-materia-actual">Selecciona una materia</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
                <button id="btn-nuevo-apunte" disabled style="font-size: 0.85rem; padding: 8px 10px; flex-grow: 1;">+ Nuevo Apunte</button>
                <button id="btn-editar-materia" style="display: none; background-color: #f39c12; font-size: 0.85rem; padding: 8px 10px; flex-grow: 1;">✏️ Editar</button>
                <button id="btn-eliminar-materia" style="display: none; background-color: var(--danger); font-size: 0.85rem; padding: 8px 10px; flex-grow: 1;">🗑️ Eliminar</button>
            </div>

            <div id="controles-filtro" style="display: none; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="input-buscar-apunte" placeholder="🔍 Buscar apunte por título..." style="padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); outline: none;">
                <select id="select-orden-fecha" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); outline: none; cursor: pointer;">
                    <option value="desc">📅 Más recientes primero</option>
                    <option value="asc">📅 Más antiguos primero</option>
                </select>
            </div>

            <ul id="lista-apuntes">
                <!-- Los apuntes de la materia seleccionada aparecerán aquí -->
            </ul>
        </section>

        <!-- Panel 3: Editor -->
        <main class="editor">
            <!-- NUEVO: Botón de navegación exclusivo para móviles -->
            <button id="btn-volver-movil" style="display: none; background-color: transparent; border: none; color: var(--primary); margin-bottom: 10px; font-weight: 600; text-align: left; padding: 0; font-size: 1.1rem; width: fit-content;">
                <span style="font-size: 1.5rem; vertical-align: sub; margin-right: 5px;">‹</span> Volver
            </button>

            <input type="text" id="input-titulo" placeholder="Título del apunte..." disabled>
            <!-- El nuevo contenedor para Quill -->
            <div id="editor-container" style="height: 60vh; margin-bottom: 20px;"></div>
            <div class="editor-actions">
                <!-- Botón rojo oculto por defecto -->
                <button id="btn-eliminar" style="background-color: #e74c3c; display: none; margin-right: 10px;">Eliminar Apunte</button>
                <button id="btn-exportar-pdf" style="display: none; background-color: #10b981; margin-right: 10px;">📄 Exportar a PDF</button>
                <button id="btn-guardar" disabled>Guardar Apunte</button>
            </div>
        </main>
    </div>

    <!-- Archivo principal de lógica como módulo -->
    <script type="module" src="app.js"></script>
    <!-- Sistema de Ventanas Emergentes (Modales) -->
    <div id="modal-overlay" class="modal-oculto">
        <div class="modal-box">
            <h3 id="modal-titulo">Título</h3>
            <p id="modal-mensaje">Mensaje</p>
            <input type="text" id="modal-input" style="display: none;">
            <div class="modal-acciones">
                <button id="modal-btn-cancelar" class="btn-secundario">Cancelar</button>
                <button id="modal-btn-confirmar">Aceptar</button>
            </div>
        </div>
    </div>
    <!-- Contenedor para las notificaciones (Toasts) -->
    <div id="toast-container"></div>
</body>
</html>
